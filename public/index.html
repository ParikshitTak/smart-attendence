<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Attendance</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="center">
  <div style="max-width:520px;text-align:center">
    
    <div class="logo" style="justify-content:center;display:flex;align-items:center;gap:12px;font-size:2rem;font-weight:800;margin-bottom:34px; letter-spacing:-0.5px;">
      <span class="logo-mark">◈</span> Smart Attendance
    </div>
    
    <div style="display:grid;gap:16px;max-width:340px;margin:0 auto">
      <!-- Teacher Login Button (Golden) -->
      <a href="/teacher.html" class="btn-primary" style="padding:18px;text-align:center;font-size:1.1rem;border-radius:14px;">
        👩‍🏫 Teacher Login
      </a>
      
      <!-- Student Login Button (Now also Golden!) -->
      <a href="/student.html" class="btn-primary" style="padding:18px;text-align:center;font-size:1.1rem;border-radius:14px;">
        🎓 Student Login
      </a>
    </div>
    
    <p style="color:var(--muted);font-size:.85rem;margin-top:48px; line-height:1.8;">
      Demo: teacher <code style="color:var(--beige)">prof_sharma</code> / <code style="color:var(--beige)">teacher123</code><br>
      student <code style="color:var(--beige)">CSE001</code> / <code style="color:var(--beige)">student123</code>
    </p>
  </div>
</div>
</body>
</html>
