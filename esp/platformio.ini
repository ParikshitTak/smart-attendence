[env:esp32cam]
platform = espressif32@5.3.0
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    alvarowolfx/ESP32QRCodeReader

; AI Thinker ESP32-CAM needs PSRAM enabled
board_build.f_cpu = 240000000L
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue